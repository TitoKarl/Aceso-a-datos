<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
        background: #efefef;
        font-family: "Segoe UI", sans-serif;
    }
    input, textarea, select, option {
        font-family: "Segoe UI", sans-serif;
        font-size: 1rem;
        padding: 3px, 8px;
    }
    form {
        width: 100%;
        max-width: 600px;
        margin: auto;
        background: #f5f5f5;
        padding: 30px;
        border: #eee solid 1px;
    }
    input, textarea, select{
        width: 100%;
        margin-bottom: 15px;
    }
    input[type='submit'] {
        width: auto; 
        border: none;
        background-color: forestgreen;
        color: white;
        font-weight: bold;
        font-size: 1.1rem;
        padding: 6px 15px;
    }
    input[type='submit']:hover{
        
        background-color: #29a629;
        box-shadow: 0px 3px 4px grey;
    }
    #boton {
        text-align: right;
    }
    .fila {
        display: flex;
        gap: 30px;
        align-items: end;
    }
    .columna1 {
        width: 60%;
    }
    .columna2 {
        width: 40%;
    }
    
    input[type='checkbox']{
        width: auto;
        
    }
    </style>
</head>
<body>
    <header>
        <h1>Formulario Responsive</h1>

        <article>
            <form action="http://www.cursos-diseño.es/mostrar.php" method="post">
                Nombre
                <input type="text" name="nombre">
                <div class="fila">
                    <div class="columna1">
                        Email
                        <input type="email" name="email">
                    </div>
                    <div class="columna2">
                        Telefono
                        <input type="text" name="telefono">
                    </div>
                </div>
                <div class="fila">
                    <div class="columna1">
                    Tipo de habitacion
                    <select name="habitacion">
                    <option value="i1">Individual</option>
                    <option selected value="d2">Doble 2 camas</option>
                    <option value="d1">Doble matrimonio</option>
                    <option value="t3">Triple 3 camas</option>
                    <option value="t2">Tripe matrimonio+individual</option>
                </select>
                </div>
            
                <div class="columna2">
                <label><input type="checkbox" name="desayuno" value="si"></label>
                Desayuno
                </div>
                </div>
            
                
                Comentario
                <textarea name="comentario" rows="5"></textarea>
                <div id="boton"><input type="submit"></div>



            </form>
        </article>
    </header>
</body>
</html>
