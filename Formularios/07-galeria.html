<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #fafafa;
        }
        img {
            width: 300px;
            aspect-ratio: 1/1;
            object-fit: cover;
        }
        article {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }   
        article div {
            width: 320px;
            height: 320px;
            padding: 10px;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 1px 3px #888;
            margin: auto;
        }
    </style>
</head>
<body>
    <header>
        <h2>Galería</h2>
    </header>
    
    <article>
        <div><img src="pruebas/madrid1.jpg" id = "primera"></div>
        <div><img src="pruebas/madrid2.jpg" id = "segunda"></div>
        <div><img src="pruebas/madrid3.jpg" id = "tercera"></div>
        <div><img src="pruebas/madrid4.jpg" id = "cuarta"></div>
        <div><img src="pruebas/madrid5.jpg" id = "quinta"></div>
        <div><img src="pruebas/madrid6.jpg" id = "sexta"></div>
    </article>
</body>
</html>
